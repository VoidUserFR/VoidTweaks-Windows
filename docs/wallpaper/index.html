<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>VoidTweaks — Live Wallpaper</title>
<style>
  :root { --p:#8B7CF0; --b:#5378ff; --t:#35b9ad; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#000; }
  #sky {
    position:fixed; inset:0;
    background:radial-gradient(130% 120% at 50% 38%, #16131f 0%, #0b0812 46%, #050309 74%, #000 100%);
  }
  /* nebulae */
  .neb { position:absolute; border-radius:50%; filter:blur(70px); mix-blend-mode:screen; }
  .n1 { width:52vw; height:52vw; left:8%;  top:-12%; background:radial-gradient(circle, rgba(139,124,240,.42), transparent 64%); animation:drift1 46s ease-in-out infinite; }
  .n2 { width:46vw; height:46vw; right:4%; top:22%;  background:radial-gradient(circle, rgba(83,120,255,.34), transparent 64%);  animation:drift2 58s ease-in-out infinite; }
  .n3 { width:44vw; height:44vw; left:34%; bottom:-16%; background:radial-gradient(circle, rgba(53,185,173,.26), transparent 64%); animation:drift3 64s ease-in-out infinite; }
  @keyframes drift1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(4vw,3vh)} }
  @keyframes drift2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-3vw,2vh)} }
  @keyframes drift3 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(2vw,-3vh)} }

  /* star field (two layers for parallax) */
  #stars, #stars2 { position:absolute; inset:0; }
  #stars  { animation:spin 420s linear infinite; }
  #stars2 { animation:spin 680s linear infinite reverse; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .s { position:absolute; border-radius:50%; background:#fff; }
  .s.g { box-shadow:0 0 6px 1px rgba(255,255,255,.9), 0 0 16px 4px rgba(173,165,230,.55); }
  @keyframes tw { 0%,100%{opacity:var(--o0)} 50%{opacity:var(--o1)} }

  /* shooting stars */
  .shoot { position:absolute; width:2px; height:2px; background:#fff; border-radius:50%;
           box-shadow:0 0 8px 2px rgba(255,255,255,.8); opacity:0; }
  .shoot::after { content:""; position:absolute; right:2px; top:50%; width:140px; height:1px;
                  background:linear-gradient(90deg, rgba(255,255,255,.8), transparent); transform:translateY(-50%); }
  .sh1 { top:18%; left:70%; animation:shoot 9s ease-in 2s infinite; }
  .sh2 { top:62%; left:85%; animation:shoot 13s ease-in 7s infinite; }
  @keyframes shoot {
    0% { opacity:0; transform:translate(0,0) rotate(18deg); }
    3% { opacity:1; }
    12%{ opacity:0; transform:translate(-46vw,22vh) rotate(18deg); }
    100%{ opacity:0; }
  }

  /* centerpiece */
  .center { position:absolute; inset:0; display:grid; place-items:center; }
  .stack { display:flex; flex-direction:column; align-items:center; animation:float 11s ease-in-out infinite; }
  @keyframes float { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-1.6vh)} }

  .halo { position:relative; width:24vmin; height:24vmin; display:grid; place-items:center; }
  .halo::before { content:""; position:absolute; width:150%; height:150%; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,.22), rgba(139,124,240,.1) 42%, transparent 66%);
    animation:pulse 7s ease-in-out infinite; }
  @keyframes pulse { 0%,100%{opacity:.55; transform:scale(1)} 50%{opacity:.9; transform:scale(1.07)} }
  .ring { position:absolute; width:150%; height:150%; border-radius:50%;
          border:1.5px solid transparent; border-top-color:rgba(173,165,230,.5); border-right-color:rgba(255,255,255,.28);
          animation:spin 24s linear infinite; }
  .ring.r2 { width:128%; height:128%; border-top-color:rgba(255,255,255,.28); border-left-color:rgba(139,124,240,.4); animation:spin 16s linear infinite reverse; }
  .logo { width:100%; height:100%; display:block; border-radius:22%;
          filter:drop-shadow(0 0 22px rgba(255,255,255,.4)) drop-shadow(0 0 60px rgba(139,124,240,.4)); position:relative; z-index:2; }

  .wordmark { margin-top:3.4vh; font-family:'Segoe UI',system-ui,sans-serif; font-weight:800; letter-spacing:.4vmin;
              font-size:5.2vmin; line-height:1; color:#fff;
              background:linear-gradient(180deg,#fff,#cdcbd9); -webkit-background-clip:text; background-clip:text; -webkit-text-fill-color:transparent;
              animation:glowtext 7s ease-in-out infinite; }
  @keyframes glowtext { 0%,100%{filter:drop-shadow(0 0 8px rgba(255,255,255,.12))} 50%{filter:drop-shadow(0 0 18px rgba(139,124,240,.35))} }
  .tag { margin-top:1.4vh; font-family:'Segoe UI',system-ui,sans-serif; font-weight:500; font-size:2vmin; letter-spacing:.3vmin; color:#9a97ad; opacity:.85; }

  .vignette { position:fixed; inset:0; pointer-events:none; box-shadow:inset 0 0 28vmin 8vmin rgba(0,0,0,.6); }
  @media (prefers-reduced-motion: reduce) { * { animation:none !important; } }
</style>
</head>

<script>
// scatter stars across the viewport (percent-based so any resolution works)
function field(id, count, big){
  const host = document.getElementById(id);
  let seed = id === 'stars' ? 7 : 99;
  const rnd = ()=>{ seed=(seed*1103515245+12345)&0x7fffffff; return seed/0x7fffffff; };
  let html = '';
  for(let i=0;i<count;i++){
    const sz = big ? (rnd()>.8?3:2) : (rnd()>.9?2:1);
    const o0 = (big?0.25:0.1)+rnd()*0.3, o1 = o0 + 0.25 + rnd()*0.4;
    const dur = (2.5+rnd()*5).toFixed(2), delay = (-rnd()*7).toFixed(2);
    const glow = big && rnd()>0.7 ? ' g' : '';
    html += `<span class="s${glow}" style="left:${(rnd()*100).toFixed(2)}%;top:${(rnd()*100).toFixed(2)}%;width:${sz}px;height:${sz}px;--o0:${o0.toFixed(2)};--o1:${Math.min(1,o1).toFixed(2)};animation:tw ${dur}s ease-in-out ${delay}s infinite"></span>`;
  }
  host.innerHTML = html;
}
field('stars', 150, true);
field('stars2', 110, false);

// be a good wallpaper: fully pause when not visible (Lively pauses on fullscreen apps)
document.addEventListener('visibilitychange', ()=>{
  document.body.style.animationPlayState = document.hidden ? 'paused' : 'running';
});
</script>
